[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "spain-electricity-pipeline"
version = "0.1.0"
description = "A reproducible REData electricity-generation pipeline with reconciled SQL reporting."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["duckdb==1.5.6", "tzdata>=2025.2", "pytz>=2025.2"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.10"]

[project.scripts]
electricity-pipeline = "electricity_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
electricity_pipeline = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
